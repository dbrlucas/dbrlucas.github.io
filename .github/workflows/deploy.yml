# Construit le site (Astro, puis l'index de recherche Pagefind) et le publie sur GitHub Pages.
# Ne tourne que dans le dépôt public dbrlucas.github.io : dans tout autre dépôt (le dépôt privé de
# travail, une copie), le travail est ignoré et rien n'est publié.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; celui en cours va jusqu'au bout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    if: github.repository == 'dbrlucas/dbrlucas.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
